name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project RaceDayReady.xcodeproj \
            -scheme RaceDayReady \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Launch in the simulator and take screenshots
        id: run
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/report/shots
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/RaceDayReady.app" -maxdepth 6 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.electricsoup.racedayready
          sleep 8
          xcrun simctl io "$DEVICE" screenshot "/tmp/report/shots/first-launch.png"
          for tab in pack outfits prep content; do
            xcrun simctl launch --terminate-running-process "$DEVICE" com.electricsoup.racedayready -demoTrip -demoPro -tab "$tab"
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "/tmp/report/shots/$tab.png"
          done
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "RaceDayReady"' > /tmp/report/app-log.txt 2>&1 || true
          for f in ~/Library/Logs/DiagnosticReports/RaceDayReady*.ips; do
            [ -e "$f" ] || continue
            echo "==== $f" >> /tmp/report/crashes.txt
            python3 - "$f" >> /tmp/report/crashes.txt 2>&1 <<'PY' || true
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text.split("\n", 1)[1])
          print("exception:", body.get("exception"))
          print("termination:", body.get("termination"))
          print("asi:", body.get("asi"))
          images = body.get("usedImages", [])
          for th in body.get("threads", []):
              if th.get("triggered"):
                  for fr in th.get("frames", [])[:25]:
                      img = images[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex") is not None and fr["imageIndex"] < len(images) else "?"
                      print(" ", img, fr.get("symbol", ""), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done
          touch /tmp/report/crashes.txt

      # Saves a short report to the ci-results branch so the result can be read without opening GitHub.
      - name: Publish build report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"
            echo "status: ${{ steps.build.outcome }}"
            echo "simulator run: ${{ steps.run.outcome }}"
            xcodebuild -version
            echo "---- errors ----"
            grep -E ": error: |error: " build.log | sort -u | head -150 || true
            echo "---- last lines ----"
            tail -40 build.log
          } > /tmp/report/result.txt
          cd /tmp/report
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          git add -A
          git commit -qm "Build report for $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results
