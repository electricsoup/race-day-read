# project.yml — XcodeGen spec for Race Day Ready (backup way to rebuild the .xcodeproj)
#
# You normally don't need this: RaceDayReady.xcodeproj is included and is regenerated by
# tools/make_xcodeproj.py whenever files are added. If the project file ever breaks:
#   brew install xcodegen && xcodegen generate

name: RaceDayReady
options:
  bundleIdPrefix: com.electricsoup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RaceDayReady:
    type: application
    platform: iOS
    sources:
      - path: RaceDayReady
        excludes:
          - "Resources/Products.storekit"
          - "Info.plist"
          - "RaceDayReady.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.electricsoup.racedayready
        INFOPLIST_KEY_CFBundleDisplayName: "Race Day Ready"
        INFOPLIST_FILE: RaceDayReady/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: RaceDayReady/RaceDayReady.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  RaceDayReady:
    build:
      targets:
        RaceDayReady: all
    run:
      config: Debug
      storeKitConfiguration: "RaceDayReady/Resources/Products.storekit"
    archive:
      config: Release
